<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q&amp;A – Abborren Backyard Ultra 2026</title>
<link rel="icon" href="../assets/img/logo.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="page">
    <a class="back-link" href="../index.html">&larr; Tillbaka</a>
    <div class="site-header">
      <img class="logo" src="../assets/img/logo.png" alt="Abborren logga">
      <h1>Q&amp;A</h1>
    </div>

    <div id="qa-container"></div>

    <div class="card">
      <h2>Ställ en fråga</h2>
      <p style="opacity:0.7; margin-top:-6px;">Din fråga läggs upp här direkt. Vi svarar så snart vi kan.</p>
      <label for="new-question">Din fråga</label>
      <input type="text" id="new-question" placeholder="Skriv din fråga här">
      <button type="button" class="submit-btn" id="ask-question-btn">Skicka fråga</button>
      <p id="ask-question-msg" style="display:none;">Tack, din fråga är upplagd! 🎉</p>
    </div>
  </div>

  <footer class="site-footer">Abborren Backyard Ultra &middot; Est. 2025</footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/config-defaults.js"></script>
  <script src="../js/db.js"></script>
  <script src="../js/qa.js"></script>
  <a class="pi-btn" href="admin.html" title="Admin">&pi;</a>
</body>
</html>
